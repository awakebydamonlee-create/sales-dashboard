<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>매출 트레킹 - 인덱스</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif;background:#0f1823;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{max-width:900px;padding:40px}
h1{font-size:28px;margin-bottom:10px}
.sub{color:#94a3b8;margin-bottom:30px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{background:#1e293b;padding:24px;border-radius:12px;text-decoration:none;color:#fff;transition:transform 0.15s, background 0.15s}
.card:hover{background:#334155;transform:translateY(-2px)}
.card .icon{font-size:32px;margin-bottom:10px}
.card .title{font-size:18px;font-weight:700;margin-bottom:4px}
.card .desc{font-size:13px;color:#94a3b8}
.footer{color:#64748b;font-size:12px;text-align:center;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
<h1>📊 매출 트레킹</h1>
<div class="sub">기간: 2025-01-01 ~ 2026-04-22 · 국내+해외 · 16개월 · 321개 상품 · 20,832주문</div>
<div class="grid">
  <a href="sales_dashboard.html" class="card">
    <div class="icon">📊</div>
    <div class="title">매출 대시보드</div>
    <div class="desc">일별/월별 매출 추이, 채널별 비중</div>
  </a>
  <a href="product_analytics.html" class="card">
    <div class="icon">🛍️</div>
    <div class="title">상품 분석</div>
    <div class="desc">상품 랭킹, 카테고리 분포, 필터링</div>
  </a>
  <a href="product_report.html" class="card">
    <div class="icon">📦</div>
    <div class="title">상품 리포트</div>
    <div class="desc">상품별 월별 판매 상세 드릴다운</div>
  </a>
  <a href="insights.html" class="card">
    <div class="icon">🔎</div>
    <div class="title">인사이트</div>
    <div class="desc">국가별, 요일별, 재구매 분석</div>
  </a>
</div>
<div class="footer">업데이트: 2026-04-22</div>
</div>
</body>
</html>
