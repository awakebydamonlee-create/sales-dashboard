<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매출 트레킹</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .container { max-width: 900px; width: 100%; }
  .header { margin-bottom: 36px; }
  .title {
    font-size: 36px;
    font-weight: 800;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .title-icon { font-size: 36px; }
  .meta {
    font-size: 14px;
    color: #94a3b8;
    letter-spacing: 0.01em;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 32px;
  }
  .card {
    background: #16213e;
    border-radius: 16px;
    padding: 36px 32px;
    text-decoration: none;
    color: inherit;
    transition: background 0.18s, transform 0.18s;
    display: block;
  }
  .card:hover {
    background: #1e2d50;
    transform: translateY(-2px);
  }
  .card-icon { font-size: 36px; margin-bottom: 16px; display: block; }
  .card-title {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 6px;
  }
  .card-desc { font-size: 13px; color: #94a3b8; }
  .footer {
    text-align: center;
    font-size: 13px;
    color: #475569;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title">
      <span class="title-icon">📊</span>
      <span>매출 트레킹</span>
    </div>
    <div class="meta">기간: 2025-01-01 ~ 2026-06-24 · 국내+해외 · 18개월 · 350개 상품 · 24,091주문</div>
  </div>

  <div class="grid">
    <a class="card" href="sales_dashboard.html">
      <span class="card-icon">📊</span>
      <div class="card-title">매출 대시보드</div>
      <div class="card-desc">일별/월별 매출 추이, 채널별 비중</div>
    </a>
    <a class="card" href="product_analytics.html">
      <span class="card-icon">🛍️</span>
      <div class="card-title">상품 분석</div>
      <div class="card-desc">상품 랭킹, 카테고리 분포, 필터링</div>
    </a>
    <a class="card" href="product_report.html">
      <span class="card-icon">📦</span>
      <div class="card-title">상품 리포트</div>
      <div class="card-desc">상품별 월별 판매 상세 드릴다운</div>
    </a>
    <a class="card" href="insights.html">
      <span class="card-icon">🔎</span>
      <div class="card-title">인사이트</div>
      <div class="card-desc">국가별, 요일별, 재구매 분석</div>
    </a>
  </div>

  <div class="footer">업데이트: 2026-06-24</div>
</div>
</body>
</html>
